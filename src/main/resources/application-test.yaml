spring:
  application:
    name: personal-expense-tracker

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  session:
    store-type: none

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test
          github:
            client-id: test
            client-secret: test

  web:
    cors:
      allowed-origins: http://localhost:3000

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.personalexpensetracker: DEBUG

app:
  base-url: http://localhost:3000
  cors-allowed-origin: http://localhost:3000
